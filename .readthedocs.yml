version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # Using build.commands gives full control of the build; it is mutually exclusive
  # with the `sphinx:`/`python:` keys, so the Sphinx invocation is explicit below.
  commands:
    # `pip` is the selected tool's pip, on PATH; installing uv puts the `uv` console
    # script on that same PATH for the following commands.
    - pip install uv
    # Resolve the docs dependency group and build the package (autodoc imports jaxdecomp,
    # so the compiled extension is built here too; scikit-build-core fetches cmake/ninja).
    - uv sync --group docs
    - uv run sphinx-build -T -b html docs $READTHEDOCS_OUTPUT/html
