[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=1.3.2", "jax>=0.4.35", "setuptools_scm>=8"]
build-backend = "scikit_build_core.build"
[project]
name = "jaxdecomp"
dynamic = ["version"]
requires-python = ">=3.11"
description = "JAX bindings for the cuDecomp library"
authors = [
  { name = "Wassim Kabalan" },
  { name = "Francois Lanusse"}
]
urls = { "Homepage" = "https://github.com/DifferentiableUniverseInitiative/jaxDecomp" }
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "jaxtyping>=0.2.0",
  "jax>=0.4.35",
]

[project.optional-dependencies]
test = [
    'pytest>=8.0.0',
    'pytest-cov',
    'pytest-mock',
    'chex',
]
benchmark = [
    'jax-hpc-profiler>=0.3.2',
]
cuda = [
    'jax[cuda12]>=0.4.35',
]

[dependency-groups]
docs = [
    'sphinx>=5,<6',
    'myst-parser>=0.18,<0.19',
    'sphinx-rtd-theme',
]
dev = [
    { include-group = 'docs' },
    'jaxdecomp[test]',
    'pre-commit',
    'mypy',
]

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.25"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
CMAKE_LIBRARY_OUTPUT_DIRECTORY = ""

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]

[tool.uv]
# Rebuild the compiled extension on editable installs when C/CMake sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "CMakeLists.txt" }, { file = "src/csrc/**" }]

[tool.cibuildwheel]
test-extras = "test"
test-command = "pytest {project}/tests"

[tool.pytest.ini_options]
addopts = '-rfEX --cov=jaxdecomp --doctest-modules'
testpaths = [
    'tests',
]

[tool.ruff]
line-length = 150
fix = true
src = ["src"]
exclude = ["third_party"]

[tool.ruff.lint]
select = [
    # pycodestyle
    'E',
    # pyflakes
    'F',
    # pyupgrade
    'UP',
    # flake8-debugger
    'T10',
    # isort
    'I',
]

ignore = [
    'E402', # module level import not at top of file
    'E203',
    'E731',
    'E701',
    'E741',
    'E722',
    'UP037', # conflicts with jaxtyping Array annotations
]


[tool.ruff.format]
quote-style = 'single'

[[tool.mypy.overrides]]
module = []
ignore_missing_imports = true
